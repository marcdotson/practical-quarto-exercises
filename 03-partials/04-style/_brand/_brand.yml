# Bureau of Regional Statistics — the fictional statistical agency used
# across these exercises, so every render looks like one organization
# published it. See the README for how to pull it into a folder.

meta:
  name: Bureau of Regional Statistics
  link:
    home: https://example.gov/brs

logo:
  images:
    mark:
      path: brs-logo.svg
      alt: Bureau of Regional Statistics
  small: mark
  medium: mark
  large: mark

color:
  palette:
    forest: "#1B5E4F"
    slate: "#3D4A54"
    sand: "#EFE9DD"
    ink: "#1F2A2E"
  foreground: ink
  background: white
  primary: forest
  secondary: slate

typography:
  # Font family names must be valid CSS identifiers. Quarto writes the family
  # into CSS unquoted, so a name that contains a bare number ("Source Sans 3")
  # produces `font-family:Source Sans 3`, which every browser discards.
  fonts:
    - family: Atkinson Hyperlegible
      source: google
      # Typst only embeds the faces listed here, so bold and italic need
      # asking for. Quarto 1.11.4 drops the weight when the style is italic,
      # so the bold-italic face never arrives even though Google serves it.
      # An #emph inside a #strong therefore keeps the italic and loses the
      # bold. Harmless here; nothing in these exercises needs both at once.
      weight: [400, 600, 700]
      style: [normal, italic]
    - family: Source Code Pro
      source: google
  base: Atkinson Hyperlegible
  headings:
    family: Atkinson Hyperlegible
    weight: 600
  monospace: Source Code Pro
